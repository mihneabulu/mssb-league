name: Nightly backup

# The git repo used to be the backup: every game arrived as a commit. Now the league
# lives in D1, which has no history and no second copy, so this pulls a full export
# every night and commits it here.
#
# Needs three secrets:
#   LEAGUE_URL               https://mssbleague.com
#   CF_ACCESS_CLIENT_ID      Access service token id
#   CF_ACCESS_CLIENT_SECRET  Access service token secret
#
# The service token must be allowed by a policy on the Access application, otherwise
# Access will bounce this the same way it bounces an unauthenticated browser.

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC daily, off the hour to avoid the stampede
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CF_ACCESS_CLIENT_ID }}" ] && [ -n "${{ secrets.LEAGUE_URL }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping backup — set LEAGUE_URL, CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET."
          fi

      - name: Fetch export
        if: steps.creds.outputs.ready == 'true'
        env:
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p backups

          # Diagnostics that never print the secret itself. A Cloudflare service token
          # client id looks like "<uuid>.access"; a pasted-wrong value usually shows up
          # here as the wrong length or a missing suffix.
          echo "URL:       ${LEAGUE_URL}/api/admin/export"
          # A prefix, not the whole value: the client id is an identifier, not the
          # secret, and seeing the first characters lets it be compared against the
          # Service Tokens list in the dashboard.
          echo "client id: ${#CF_ACCESS_CLIENT_ID} chars, starts '${CF_ACCESS_CLIENT_ID:0:8}', ends '${CF_ACCESS_CLIENT_ID##*.}'"
          echo "secret:    ${#CF_ACCESS_CLIENT_SECRET} chars"
          case "${CF_ACCESS_CLIENT_ID}" in
            *[[:space:]]*) echo "::warning::client id contains whitespace — check for a stray newline" ;;
          esac
          case "${CF_ACCESS_CLIENT_SECRET}" in
            *[[:space:]]*) echo "::warning::client secret contains whitespace — check for a stray newline" ;;
          esac

          code=$(curl -sS --max-time 120 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -D /tmp/headers.txt \
            -o backups/league-backup.json -w '%{http_code}' \
            "${LEAGUE_URL}/api/admin/export")
          echo "HTTP ${code}"

          if [ "${code}" != "200" ]; then
            echo "--- response headers ---"
            grep -iE '^(location|cf-|content-type)' /tmp/headers.txt || true
            echo "--- first 200 bytes of body ---"
            head -c 200 backups/league-backup.json || true
            echo
            echo "::error::Access did not accept the service token. A 302 to the login page means the application policy is not matching this token — check the policy Action is 'Service Auth' (not Allow) on the application that covers this hostname."
            # Leave the previous backup untouched.
            git checkout -- backups/ 2>/dev/null || rm -f backups/league-backup.json
            exit 1
          fi

      - name: Sanity-check the export before committing
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # A redirect to the Access login is still a 200 of HTML, so check the shape
          # rather than the status: a bad backup that overwrites a good one is worse
          # than no backup at all.
          python3 - <<'PY'
          import json, sys
          with open('backups/league-backup.json') as f:
              data = json.load(f)
          seasons = data.get('seasons')
          if not isinstance(seasons, list) or not seasons:
              sys.exit('export contains no seasons')
          games = sum(len(s.get('games', [])) for s in seasons)
          teams = sum(len(s.get('teams', [])) for s in seasons)
          if games == 0 and teams == 0:
              sys.exit('export is empty')
          print(f'{len(seasons)} season(s), {teams} teams, {games} games')
          PY

      # The archived originals are the only copies for any season no longer sitting in
      # results/. They never change once written, so this only fetches what is missing —
      # one file per game, which git then stores once instead of rewriting a blob nightly.
      - name: Sync archived uploads
        if: steps.creds.outputs.ready == 'true'
        env:
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, sys, urllib.request

          base = os.environ['LEAGUE_URL'].rstrip('/')
          headers = {
              'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'],
              'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET'],
              # Cloudflare's Browser Integrity Check rejects urllib's default agent with
              # "error code: 1010" before Access is ever consulted — which reads exactly
              # like an authentication failure and is not one. curl's default agent is
              # allowed, which is why the JSON export above worked and this did not.
              'User-Agent': 'mssb-league-backup/1 (+https://github.com/mihneabulu/mssb-league)',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode('utf-8', 'replace')
                  shown = url.replace(base, '<league>')
                  print(f'{shown} -> HTTP {e.code}')
                  print(f'  content-type: {e.headers.get("content-type")}')
                  print(f'  location:     {e.headers.get("location")}')
                  print(f'  body:         {body!r}')
                  raise

          manifest = json.loads(get(f'{base}/api/admin/export/raw'))
          files = manifest.get('files')
          if not isinstance(files, list):
              sys.exit('raw manifest has no file list')

          root = pathlib.Path('backups/raw')
          fetched = skipped = 0
          for f in files:
              dest = root / f['season'] / f"{f['rioGameId']}.json.gz"
              if dest.exists():
                  skipped += 1
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              blob = get(f"{base}/api/admin/export/raw?id={f['id']}")

              # Verify before keeping it: the manifest's sha256 is of the decompressed
              # original, so this checks the gzip is intact and the bytes are the ones
              # that were uploaded.
              digest = hashlib.sha256(gzip.decompress(blob)).hexdigest()
              if digest != f['sha256']:
                  sys.exit(f"checksum mismatch for {f['rioGameId']}; refusing to store it")
              dest.write_bytes(blob)
              fetched += 1

          root.mkdir(parents=True, exist_ok=True)
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'{fetched} new, {skipped} already held, {len(files)} total')
          PY

      - name: Commit if anything changed
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then compare the index. `git diff` alone only looks at tracked
          # files, so a brand new backup file registered as "no change" and was never
          # committed — the job went green while producing nothing.
          git add backups/
          if git diff --cached --quiet -- backups/; then
            echo "Backup is identical to the last one; nothing to commit."
            exit 0
          fi

          git commit -m "Nightly league backup"
          git push
